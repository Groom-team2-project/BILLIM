name: billim-rental-perf
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: billim_rental_perf
      MYSQL_USER: rental_perf
      MYSQL_PASSWORD: local_rental_perf
      MYSQL_ROOT_PASSWORD: local_rental_root
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -uroot --silent']
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - rental-db:/var/lib/mysql
  backend:
    build:
      context: ../../backend
    ports:
      - '127.0.0.1:18081:8080'
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/billim_rental_perf
      SPRING_DATASOURCE_USERNAME: rental_perf
      SPRING_DATASOURCE_PASSWORD: local_rental_perf
      KAKAO_CLIENT_ID: local-perf-placeholder
      KAKAO_CLIENT_SECRET: local-perf-placeholder
      OUTBOX_ENABLED: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1g
volumes:
  rental-db:
