name: billim-perf-multi

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: billim_perf
      MYSQL_USER: billim_perf
      MYSQL_PASSWORD: local_perf_only
      MYSQL_ROOT_PASSWORD: local_perf_root_only
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - perf-mysql:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30

  backend-a:
    image: ${PERF_IMAGE:?PERF_IMAGE required}
    ports:
      - "127.0.0.1:18080:8080"
    environment: &backend-environment
      SPRING_PROFILES_ACTIVE: perf
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/billim_perf
      SPRING_DATASOURCE_USERNAME: billim_perf
      SPRING_DATASOURCE_PASSWORD: local_perf_only
      REDIS_URL: redis://redis:6379
      KAKAO_CLIENT_ID: local-perf-id
      KAKAO_CLIENT_SECRET: local-perf-secret
      OUTBOX_ENABLED: 'false'
      JAVA_TOOL_OPTIONS: '-Dchat.relay.diagnostics=true'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g

  backend-b:
    image: ${PERF_IMAGE:?PERF_IMAGE required}
    ports:
      - "127.0.0.1:18081:8080"
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g

  k6:
    image: grafana/k6:0.54.0
    profiles: [load]
    working_dir: /scripts
    volumes:
      - ./:/scripts:ro
    environment:
      BASE_URL: http://backend-a:8080
      BACKEND_A_URL: http://backend-a:8080
      BACKEND_B_URL: http://backend-b:8080
    depends_on:
      - backend-a
      - backend-b

volumes:
  perf-mysql:
