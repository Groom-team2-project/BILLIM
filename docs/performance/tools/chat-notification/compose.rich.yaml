name: billim-perf-rich
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: billim_perf
      MYSQL_ROOT_PASSWORD: local_perf_root_only
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - rich-mysql:/var/lib/mysql
  backend:
    image: billim-perf-rich:${RICH_VERSION:-baseline}
    ports: ["127.0.0.1:18083:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: perf
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/billim_perf
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: local_perf_root_only
      KAKAO_CLIENT_ID: local-perf-id
      KAKAO_CLIENT_SECRET: local-perf-secret
      OUTBOX_ENABLED: "false"
      AUTH_RATE_LIMIT_CSRF_PER_MINUTE: 1000
    mem_limit: 1g
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  rich-mysql:
