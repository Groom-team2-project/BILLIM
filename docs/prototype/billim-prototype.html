<style>/* Nearby tokens — palette-driven so themes retint the whole UI. */
:root {
  /* base palette (default: 크림/yellow) — theme classes override these */
  --black-b-color:#101010; --gray-d3-color:#191818; --gray-d2-color:#303030; --gray-d1-color:#606060;
  --gray-b-color:#c0c0c0; --gray-l1-color:#e8e8e8; --gray-l2-color:#f8f8f8; --white-b-color:#ffffff; --theme-b-color:#ffffff;

  /* no-suffix aliases (some bundle rules use these) */
  --black-b:var(--black-b-color); --gray-d3:var(--gray-d3-color); --gray-d2:var(--gray-d2-color); --gray-d1:var(--gray-d1-color);
  --gray-b:var(--gray-b-color); --gray-l1:var(--gray-l1-color); --gray-l2:var(--gray-l2-color); --white-b:var(--white-b-color);

  /* semantic tokens (follow the palette) */
  --bg:var(--gray-l2-color);
  --surface:var(--white-b-color);
  --surface-sunken:var(--gray-l1-color);
  --line:var(--gray-b-color);
  --line-control:#8a8a7a;
  --ink:var(--black-b-color);
  --ink-muted:var(--gray-d1-color);
  --action:var(--black-b-color);
  --on-action:var(--white-b-color);
  --focus:var(--black-b-color);
  --scrim:rgba(16,16,14,0.40);

  /* rental status (fixed across light themes) */
  --status-requested-fg:#4f3f94; --status-requested-bg:#e6e1f5; --status-requested-mark:#7b6cc4;
  --status-approved-fg:#1f5a8f; --status-approved-bg:#dce8f4; --status-approved-mark:#4d86bd;
  --status-active-fg:#2b6436; --status-active-bg:#d8ebd5; --status-active-mark:#4f9160;
  --status-returned-fg:#4d5057; --status-returned-bg:#e3e4e6; --status-returned-mark:#80848c;

.t-title{font-size:18px;line-height:26px;font-weight:700;margin:0}
.t-body-lg{font-size:16px;line-height:24px;font-weight:600;margin:0}
.t-body{font-size:15px;line-height:23px;font-weight:400;margin:0}
.t-label{font-size:14px;line-height:20px;font-weight:600;margin:0}
.t-caption{font-size:13px;line-height:18px;font-weight:500;margin:0}
.photo{aspect-ratio:4/3;width:100%;background:var(--surface-sunken);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);position:relative}
.ptile{width:76px;height:76px;border-radius:12px;background:var(--surface-sunken);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-muted);border:0;font-size:11px;font-weight:600;cursor:pointer}
.radio{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line-control);border-radius:12px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.radio.on{border-color:var(--action);border-width:2px;padding:11px 13px}
.nitem{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.nitem.unread{background:var(--surface-sunken)}
.nic{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
.dot{width:8px;height:8px;border-radius:999px;background:var(--status-overdue-mark);flex:none;margin-top:6px}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border:2px dashed var(--line-control);border-radius:16px;background:var(--surface-sunken);font-size:26px;font-weight:800;letter-spacing:.14em}
.note{font-size:12px;color:var(--ink-muted);text-align:center;padding:8px 24px}
/* Footer */
.ft{background:var(--surface);border-top:1px solid var(--line);padding:36px 40px 24px;margin-top:auto}
.ft-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1120px;margin:0 auto 24px}
.ft-col h4{font-size:14px;font-weight:700;margin:0 0 12px}
.ft-col a{display:block;font-size:13px;color:var(--ink-muted);padding:5px 0;cursor:pointer;text-decoration:none}
.ft-col a:hover{color:var(--ink)}
.ft-bottom{max-width:1120px;margin:0 auto;border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:6px}
.ft-biz,.ft-safe{font-size:12px;color:var(--ink-muted);margin:0}
.ft-meta{display:flex;gap:16px;font-size:12px;color:var(--ink-muted);margin-top:4px}
.ft.slim{padding:20px 40px}
.ft.mob{padding:8px 16px 20px;margin-top:0}
.ft.mob .ft-acc{border-bottom:1px solid var(--line)}
.ft.mob summary{padding:14px 4px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.ft.mob summary::-webkit-details-marker{display:none}
.ft.mob summary::after{content:"+";color:var(--ink-muted)}
.ft.mob details[open] summary::after{content:"–"}
.ft.mob .ft-acc-body{padding:0 4px 12px;display:flex;flex-direction:column;gap:10px}
.ft.mob .ft-acc-body a{font-size:13px;color:var(--ink-muted);text-decoration:none}
.ft.mob .ft-bottom{padding:16px 4px 0}
/* PC shell for custom screens */
.pcpage{width:100%;min-height:720px;background:var(--bg);display:flex;flex-direction:column}
.pctop{height:64px;flex:none;display:flex;align-items:center;gap:24px;padding:0 40px;background:var(--surface);border-bottom:1px solid var(--line)}
.pctop .nav{display:flex;gap:20px;font-size:15px;font-weight:600}
.pctop .nav a{color:var(--ink-muted);cursor:pointer;text-decoration:none}
.pcmid{flex:1;padding:40px 0;display:flex;justify-content:center;align-items:flex-start}
.pcwin{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(16,16,14,.06)}
.pcwin.narrow{width:440px}
.pcwin.wide{width:600px}
.pcwin .scr{height:auto}
.pcwin .scr .body{overflow:visible}
.pcwin .scr .actionbar{position:static}
/* toolbar background/theme swatches */
.swatches{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:22px;border-radius:999px;border:1px solid var(--line-control);cursor:pointer;padding:0;line-height:0}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.sw.dk{background:transparent;border:0;display:inline-flex;align-items:center;justify-content:center;margin-left:2px;border-radius:999px}
.sw.dk.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.themed.dark{--bg:#10100e;--surface:#191815;--surface-sunken:#30302b;--line:#30302b;--line-control:#77776a;--ink:#ffffe3;--ink-muted:#c0c0ab;--action:#ffffe3;--on-action:#10100e;--focus:#ffffe3;--scrim:rgba(0,0,0,.6);--shadow-float:0 6px 20px rgba(0,0,0,.45);--status-requested-fg:#cdc4f2;--status-requested-bg:#2a2540;--status-requested-mark:#8f82d6;--status-approved-fg:#b8d4f0;--status-approved-bg:#1b2a3a;--status-approved-mark:#5f97cc;--status-active-fg:#b6e0bb;--status-active-bg:#1c2e1f;--status-active-mark:#62a371;--status-returned-fg:#c9ccd2;--status-returned-bg:#26282c;--status-returned-mark:#8a8e96;--status-overdue-fg:#f5b7a5;--status-overdue-bg:#3d1f17;--status-overdue-mark:#e0704f;--status-rejected-fg:#efb6cf;--status-rejected-bg:#3a1d29;--status-rejected-mark:#cf6d9b;--status-canceled-fg:#c0c0ab;--status-canceled-bg:#191815;--status-canceled-mark:#77776a}
.ft-copy{font-size:12px;color:var(--ink-muted);margin:0}
/* theme dropdown in the app header */
.nbtheme{position:relative;display:inline-flex;align-items:center}
.nbtheme-btn{display:inline-flex;align-items:center;gap:3px;height:34px;padding:0 8px;border:1px solid var(--line-control);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.nbtheme-dot{width:16px;height:16px;border-radius:999px;border:1px solid var(--line-control);display:inline-block;flex:none}
.nbtheme-back{position:fixed;inset:0;z-index:55}
.nbtheme-menu{position:absolute;top:42px;right:0;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-float);padding:6px;min-width:172px}
.nbtheme-h{font-size:12px;font-weight:700;color:var(--ink-muted);padding:6px 10px 4px}
.nbtheme-item{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border:0;background:transparent;color:var(--ink);font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;text-align:left}
.nbtheme-item:hover{background:var(--surface-sunken)}
.nbtheme-item.on{background:var(--surface-sunken)}
.nbtheme-chk{margin-left:auto;display:inline-flex;color:var(--ink)}
.nbtheme-div{height:1px;background:var(--line);margin:5px 8px}
/* re-resolve semantic tokens on the themed element so theme classes retint */
.themed{
  --black-b:var(--black-b-color); --gray-d3:var(--gray-d3-color); --gray-d2:var(--gray-d2-color); --gray-d1:var(--gray-d1-color);
  --gray-b:var(--gray-b-color); --gray-l1:var(--gray-l1-color); --gray-l2:var(--gray-l2-color); --white-b:var(--white-b-color);
  --bg:var(--gray-l2-color); --surface:var(--white-b-color); --surface-sunken:var(--gray-l1-color);
  --line:var(--gray-b-color); --ink:var(--black-b-color); --ink-muted:var(--gray-d1-color);
  --action:var(--black-b-color); --on-action:var(--white-b-color); --focus:var(--black-b-color);
}
/* confirm modal + toast + PC dedupe */
.themed{position:relative}
.pcwin .nbtheme{display:none}
.ui-scrim{position:absolute;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px}
.ui-modal{width:100%;max-width:320px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-float);display:flex;flex-direction:column;gap:10px}
.ui-modal-t{font-size:18px;line-height:26px;font-weight:700;margin:0}
.ui-modal-b{font-size:14px;line-height:21px;color:var(--ink-muted);margin:0}
.ui-modal-a{display:flex;gap:10px;margin-top:8px}
.ui-modal-a .btn:disabled{opacity:.45;cursor:not-allowed}
.ui-modal-rp{max-width:340px}
.rp-opts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rp-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:none;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);text-align:left;width:100%}
.rp-opt:last-child{border-bottom:none}
.rp-opt .rp-radio{width:18px;height:18px;border-radius:999px;border:2px solid var(--line-control);flex:none;position:relative}
.rp-opt.on{background:var(--surface-sunken)}
.rp-opt.on .rp-radio{border-color:var(--action)}
.rp-opt.on .rp-radio:after{content:'';position:absolute;inset:3px;border-radius:999px;background:var(--action)}
.rp-ta{width:100%;box-sizing:border-box;border:1px solid var(--line-control);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.5;resize:vertical;background:var(--surface);color:var(--ink)}
.rp-ta:focus{outline:2px solid var(--focus);outline-offset:1px}
.ui-modal-a .btn{flex:1;height:46px}
.ui-toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);z-index:85;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;box-shadow:var(--shadow-float);white-space:nowrap;max-width:calc(100% - 48px)}

.pmd .body,.pmd{}
.pmd-p{margin:0 0 12px;font-size:14px;line-height:1.65;color:var(--ink)}
.pmd-ul,.pmd-ol{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6;color:var(--ink)}
.pmd-ul{list-style:disc}
.pmd-ol{list-style:decimal}
.pmd-table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:13px}
.pmd-table th,.pmd-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.5}
.pmd-table th{background:var(--surface-sunken);font-weight:700;white-space:nowrap}
.pmd strong{font-weight:700}

.adm-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm-kpi{padding:14px}
.adm-kpi-n{font-size:26px;font-weight:800;margin:4px 0 2px;line-height:1}
.adm-dot{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:6px;vertical-align:middle}
.pcwin .adm-kpis{grid-template-columns:repeat(4,1fr)}

.adm-entry{margin:12px auto 0;background:none;border:none;color:var(--ink-muted);font-size:13px;text-decoration:underline;cursor:pointer}
.adm-nav{display:flex;gap:6px;padding:10px 16px 2px;flex-wrap:wrap}
.adm-nav-b{border:1px solid var(--line-control);background:var(--surface);color:var(--ink-muted);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.adm-nav-b.on{background:var(--action);color:var(--on-action);border-color:var(--action)}
.adm-comm{display:flex;gap:6px;flex-wrap:wrap}
.adm-comm-b{border:1px solid var(--line-control);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.adm-comm-b.on{background:var(--action);color:var(--on-action);border-color:var(--action)}
.adm-filter{display:flex;gap:6px}
.adm-chip{border:1px solid var(--line-control);background:var(--surface);color:var(--ink-muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.adm-chip.on{background:var(--action);color:var(--on-action);border-color:var(--action)}
.adm-rank{width:22px;height:22px;border-radius:999px;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.adm-input{width:100%;box-sizing:border-box;border:1px solid var(--line-control);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.adm-del{width:32px;height:32px;border-radius:999px;border:1px solid var(--line-control);background:transparent;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.rp-radio.danger{border-color:var(--status-overdue-mark)}
.rp-opt.on .rp-radio.danger:after{background:var(--status-overdue-fg)}

  var POLICIES = {
    community: { title: "커뮤니티 규칙", md: "이웃을 믿고 빌려주는 서비스라, 기본 매너와 명확한 금지 행위를 나눠 둔 뒤 위반 시 단계별로 조치해요.\n\n**지켜 주세요**\n\n- 빌리기 전에 사용 방법과 반납 날짜를 먼저 약속해요.\n- 반납 약속 날짜를 지키고, 늦어질 것 같으면 미리 알려요.\n- 받은 그대로, 깨끗하게 돌려줘요.\n- 서로 존대하고, 약속 장소·시간을 이웃의 사정에 맞춰 조율해요.\n\n**금지해요**\n\n- 대여료·보증금·사례금 등 어떤 금전이나 대가를 요구하는 행위\n- 되팔기·재판매 목적이나 영리 목적의 상업적 이용\n- 채팅을 카카오톡·계좌 등 커뮤니티 밖 거래로 유도하는 행위\n- 허위 매물·과장 설명, 금지 품목(아래 목록) 등록\n- 욕설·협박·차별 등 이웃을 불쾌하게 하는 언행\n- 다른 이웃의 정보를 동의 없이 수집·공유하는 행위\n\n**위반 시 제재 단계**\n\n1. 경고 — 가벼운 1회 위반은 안내와 함께 경고해요.\n2. 일시 정지 — 반복되거나 정도가 무거우면 7~30일간 이용을 정지해요.\n3. 영구 정지 — 금전 요구·사기·반복 위반은 커뮤니티에서 영구히 내보내요.\n\n금전 요구나 사기처럼 신뢰를 정면으로 깨는 행위는 1회로도 바로 영구 정지될 수 있어요." },
    safety: { title: "안전 거래 가이드", md: "돈이 오가지 않는 대신, 상태 확인과 기록으로 분쟁을 막아요. 아래 순서를 따르면 빌려주는 사람도, 빌리는 사람도 안전해요.\n\n1. 공용 장소에서 만나요 — 경비실, 무인택배함 앞, 단지 정자처럼 사람이 오가는 곳에서 주고받아요. 집 주소를 알려주거나 묻지 않아요.\n2. 빌리기 전 상태를 함께 확인해요 — 전달받는 자리에서 함께 작동·흡집·구성품을 확인하고, 눈에 띄는 흙집은 미리 공유해요.\n3. 사진으로 기록을 남겨요 — 전달 전과 반납 직후 상태를 사진으로 남겨 두면, 나중에 파손 다툼이 생겨도 기준이 돼요.\n4. 약속 시간을 지켜요 — 전달과 반납 시간을 채팅으로 정해 두고 서로 지켜요. 변경이 생기면 미리 알려요.\n5. 반납까지 마치면 확인해 줘요 — 받은 사람은 반납을, 빌려준 사람은 '반납 확인'을 눌러 거래를 마무리해요. 이 기록이 신뢰 지표가 돼요.\n\n**돈을 요구받았다면** — BILLIM의 모든 대여는 무료예요. 대여료·보증금·사례를 요구받으면 응하지 말고, 이웃 프로필의 '신고'로 알려 줘요. 계좌 이체·외부 송금 요청은 사기 신호예요." },
    prohibited: { title: "빌려주면 안 되는 물품", md: "안전·위생·법적 사유로 아래 품목은 등록할 수 없어요. 등록되더라도 신고를 받으면 비공개·삭제되고, 반복되면 이용이 제한돼요.\n\n| 분류 | 예시 | 금지 이유 |\n| --- | --- | --- |\n| 위생·신체 접촉 | 속옷, 수영복, 면도기, 칫솔, 렌즈·마스카라 | 감염·위생 위험으로 공용 부적절 |\n| 의약품·건강 | 상비약, 체온계, 의료기기, 건강기능식품 | 오용 시 건강 위해, 관련 법 규제 |\n| 주류·담배 | 술, 담배, 전자담배 | 청소년보호·유통 제한 |\n| 위험물 | 가스·인화성 물질, 고위험 장비, 칼류 | 사고·부상 위험 |\n| 고가·고위험 자산 | 명품, 고가 카메라·드론, 귀금속 | 분실·파손 시 보증금 없는 구조상 분쟁 위험 |\n| 생명·법 위반 | 반려동물, 처방·불법 물품, 위조품 | 대여 대상이 아니거나 법에 어긋남 |\n\n**판단 기준** — 몸에 직접 닿거나 먹는 것, 사고·법적 위험이 있는 것, 잃어버렸을 때 돈으로 물어줘야 할 만큼 비싼 것은 무료·무보증금 서비스에 맞지 않아요. 애매하면 등록 전에 '문의하기'로 확인해 주세요." },
    damage: { title: "분실·파손 처리", md: "보증금이 없는 무료 서비스라, 분실·파손은 '이웃 간 선의의 해결'을 원칙으로 해요. BILLIM은 금전 보상을 강제하거나 보증하지 않고, 대화와 기록을 바탕으로 중재를 도와줘요.\n\n**책임 원칙**\n\n- 일반적인 사용 마모(자연스러운 닳음 등)은 빌려준 사람이 감안해요.\n- 부주의·오용으로 인한 파손·분실은 빌린 사람이 수리·복구·대체 등으로 성실히 책임지어요.\n- 보상 방식과 범위는 두 사람이 합의해요. 서비스가 금액을 정하거나 강제하지 않아요.\n\n**처리 절차**\n\n1. 대화 — 먼저 채팅으로 상황을 공유하고, 빌리기 전·후 사진으로 상태를 비교해요.\n2. 합의 — 수리, 동일 제품 대체, 부분 사과 등 두 사람이 받아들일 방법을 정해요.\n3. 운영팀 중재 — 합의가 어려우면 '분쟁·신고 처리'로 접수해요. 운영팀이 대화·사진 기록을 보고 중재해요.\n\n**예방 수칙** — 전달·반납 시 상태를 함께 확인하고 사진을 남기면 대부분의 분쟁은 예방돼요. 고가·고위험 물건은 애초에 등록 대상이 아니에요." },
    dispute: { title: "분쟁·신고 처리", md: "신고는 '접수 → 확인 → 조치' 3단계로 처리되고, 진행 상황은 알림으로 안내돼요. 이웃 프로필의 '신고'에서 이유를 고르면 접수돼요.\n\n**신고 사유 유형**\n\n- 돈이나 보증금을 요구했어요\n- 물건 상태가 설명과 크게 달라요\n- 약속을 반복해서 어겨요\n- 무례하거나 위협적인 언행을 했어요\n- 사기가 의심돼요\n- 기타(직접 입력)\n\n**처리 단계**\n\n1. 접수 — 신고를 넣으면 '확인 중' 상태로 운영팀에 전달돼요. 신고 내역은 프로필 › 신고 내역에서 다시 볼 수 있어요.\n2. 확인 — 운영팀이 채팅·거래 기록을 보고 사실을 확인해요. 필요하면 양쪽에 추가 설명을 요청해요.\n3. 조치 — 경고, 일시 정지, 영구 정지 중 하나로 처리하고, 결과를 '처리 완료'로 알려줘요.\n\n**처리 기간** — 접수 후 보통 3영업일 이내에 1차 안내를 드려요. 단, 허위·보복성 신고가 확인되면 신고한 사람도 이용이 제한될 수 있어요. 대화하고 싶지 않은 이웃은 '차단'으로 따로 관리할 수 있어요." },
    trust: { title: "신뢰 지표란", md: "별점이나 점수 대신, 실제 거래 기록을 그대로 보여줘요. 별점은 주관적이고 보복·압박으로 왜곡되기 쉬우니, BILLIM은 숫자로만 말하는 지표를 써요.\n\n| 지표 | 의미 | 산정 방식 |\n| --- | --- | --- |\n| 반납 약속 이행률 | 약속한 날짜에 제대로 반납했는지 | 제때 반납 횟수 ÷ 전체 대여 횟수 |\n| 거래 완료 횟수 | 빌려주고 빌린 거래를 얼마나 마쳤는지 | 반납 확인까지 끝난 거래의 누적 수 |\n| 가입 시점 | 커뮤니티에 얼마나 오래 있었는지 | 동네 인증을 마친 가입 월 |\n\n**왜 이런 지표인가요?** 돈이 오가지 않는 서비스에서 가장 중요한 건 '약속을 지키는 사람인가'예요. 그래서 검증할 수 있는 행동(제때 반납, 거래 완료)만 보여주고, 주관적인 별점은 두지 않아요. 초대 코드로 들어온 이웃도 소속을 '인증'받는 게 아니라, 거래 기록이 쌓이면서 신뢰가 생겨요." },

screens":["login","profile","profileOther"]},{"id":"B","title":"물건·검색","description":"물건을 등록하고 필요한 날짜·장소의 물건을 찾는 흐름.","owner":"주정현","tasks":[["P01","P0","물건 모델과 카테고리","소유자·커뮤니티·제목·설명·카테고리·공용 장소·공개 상태·대여 가능 기간을 모델링한다. 등록 화면과 검색 화면의 카테고리 목록을 통일한다.","노현섭"],["P02","P0","사진 업로드","목업의 최대 5장을 적용한다. 파일 형식·크기 제한, 대표 사진·순서, 업로드 실패, 저장 경로와 메타데이터 처리를 구현한다.","이지은 볼륨"],["P03","P0","물건 등록","register에서 제목·카테고리·선택 설명·장소·가능 기간·사진을 저장한다. 필수값 누락, 다른 동네 장소, 잘못된 날짜를 거부한다.","노현섭·박소빈"],["P04","P0","물건 수정","detail의 내 물건 ‘수정’에서 기존 값을 불러온다. 본인만 수정할 수 있고, 이미 승인된 기간을 침범하는 변경은 대여 규칙에 따라 제한한다.","박소빈"],["P05","P0","공개 중지와 삭제","프로필의 공개 상태·삭제 UI에 대응한다. 새 검색 노출을 중단하되 진행 중인 거래 기록을 보존한다. 삭제 가능 상태를 대여 담당과 합의한다.","박소빈·이지은"],["P06","P0","상세 기본 정보","detail의 사진·제목·설명·장소·거리·소유자 정보를 제공하고 화면에 연결한다. 내 물건과 타인 물건의 버튼을 구분한다.","이지은·노현섭"],["P07","P0","상세 가용 날짜 연결","달력의 가능 기간·예약 기간·선택 기간을 대여 담당의 규칙으로 표시한다. 날짜 충돌 시 요청 버튼 비활성화, 최신 상태 재조회와 오류 안내를 구현한다.","박소빈"],["P08","P0","공개 범위 검사","다른 커뮤니티·비공개·삭제·차단 대상 물건을 목록과 상세 모두에서 제한한다. 진행 중인 대여 조회는 별도 대여 API로 유지한다.","노현섭·박소빈"],["P09","P0","홈 조립","home의 동네 선택·회원/물건 수·카테고리·최신 물건·내 대여 현황·반납 안내를 연결한다. 집계의 원천 규칙은 각 소유 도메인을 따른다.","노현섭·박소빈"],["P10","P0","기본 검색","키워드·카테고리·커뮤니티 필터, 최신순, 페이지 크기 제한, 안정적인 페이지 이동을 구현한다. 빈 결과와 필터 초기화를 연결한다.","노현섭"],["P11","P0","기간 검색","선택한 시작일·반납일 전체가 가능 기간 안에 있고, 승인된 겹침이 없는 물건을 찾는다. 조회 결과는 예약 확정이 아니라는 문구를 유지한다.","박소빈 규칙 제공"],["P12","P0","거리와 지도 검색","기획서의 거리 검색과 목업의 가까운 순·지도 전환을 구현한다. 공용 장소 좌표로 마커·장소별 물건 목록을 표시하고 목록과 지도에 같은 필터를 적용한다.","노현섭 장소·이지은 설정"],["P13","P0","위치 없는 검색","위치 권한 거부·좌표 없음·지도 실패 시 목록을 사용할 수 있게 한다. 거리 기준점을 확정하고 ‘내 위치 기준’인지 ‘동네 중심 기준’인지 구분해 표시한다.","노현섭"],["P14","P1","프로필용 물건 목록","내 물건은 관리 상태·대기 요청 수를, 타인 물건은 공개 가능한 물건만 제공한다. 프로필 화면을 직접 소유하지 않고 API·목록 컴포넌트를 제공한다.","이지은·박소빈"],["P15","P0","화면 상태와 품질","홈의 기본/로딩/빈 동네/오류, 검색의 목록/지도/로딩/빈 결과/오류, 상세의 기본/날짜 충돌/내 물건/로딩/볼 수 없음을 확인한다. PC·모바일 모두 확인한다.","공통 통합 담당"],["P16","2차","조회 성능 개선","목록·상세 SQL 수, 검색 실행 계획, 페이지 이동·정렬 비용, 이미지 응답 크기를 측정한다. 인덱스·쿼리 개선 후에도 병목이면 캐시 후보를 평가한다.","이지은·박선우"]],"screens":["register","detail","home","search"]},{"id":"C","title":"대여·약속","description":"요청부터 반납까지의 거래 정합성과 전달·반납 약속.","owner":"박소빈","tasks":[["R01","P0","대여 규칙과 상태","요청·승인·거절·취소·대여 중·반납 완료의 허용 전이와 실행 주체를 표로 확정한다. 연체는 상태 저장 또는 계산 표시 중 한 방식을 정한다.","전원"],["R02","P0","기간 규칙","목업대로 시작일과 반납일을 모두 포함한다. 과거 날짜·역전 기간·가능 기간 밖·경계일 겹침·같은 날 대여 규칙을 정의하고 테스트한다.","주정현"],["R03","P0","대여 요청","request의 달력·선택 기간·총 일수·물건/장소 요약을 연결한다. 본인 물건, 미인증·다른 동네·차단·비공개 대상 요청을 검사한다.","노현섭·주정현"],["R04","P0","요청 중복 처리","같은 사용자의 재전송·연속 클릭에 의한 중복 요청 처리 규칙을 구현한다. 서로 다른 사용자의 겹치는 대기 요청은 승인 충돌과 구분한다.","박선우 알림"],["R05","P0","요청 취소","요청자가 취소 가능한 상태에서만 취소한다. 승인과 취소가 동시에 들어와도 최종 상태가 하나로 정해져야 한다.","박선우"],["R06","P0","승인과 동시성","소유자 권한·현재 상태·날짜 겹침을 같은 정합성 경계에서 재검사한다. 같은 물건의 겹치는 요청을 동시에 승인해도 성공은 한 건이어야 한다.","주정현"],["R07","P0","승인 충돌 화면","rentals/conflict의 충돌 안내·겹치는 대여 보기·거절 사유 보내기를 연결한다. 다른 사용자의 불필요한 정보를 노출하지 않는다.","박선우"],["R08","P0","거절과 사유","일반 거절의 선택 사유와 ‘거절하고 이유 보내기’의 필수 사유를 구분한다. 거절 결과를 기록하고 알림용 사건 정보를 제공한다.","박선우"],["R09","P0","전달 확인","승인된 대여의 전달 확인 주체를 정하고 대여 중으로 전환한다. 중복 확인이나 권한 없는 확인으로 기록·알림이 중복 생성되지 않아야 한다.","박선우"],["R10","P0","반납 확인","물건 소유자의 반납 확인, 실제 확인 시각, 완료 기록을 관리한다. 반납 전 취소나 완료 후 재승인 같은 잘못된 전이를 차단한다.","이지은·박선우"],["R11","P0","내 대여 목록","rentals의 빌린/빌려준 탭, 상태 필터·건수·거절 사유·D-day·연체·버튼 권한을 구현한다. 빈 목록·로딩·오류에 대응한다.","주정현 물건 요약"],["R12","P0","가용성·홈 요약","상세 달력·기간 검색에서 공통으로 사용할 가용성 기준을 제공한다. 홈의 요청/승인/대여 중 건수와 다음 전달·반납 정보를 제공한다.","주정현"],["R13","P1","약속 제안","채팅의 ‘약속 잡기’에서 전달/반납 종류·시간·공용 장소를 저장한다. 날짜는 대여 시작일/반납일로 고정하고 승인 상태와 참여자 권한을 검사한다.","박선우·노현섭"],["R14","P1","약속 수락·변경","상대방의 수락, 시간 바꾸기, 확정 후 변경 요청을 구현한다. 과거 제안을 뒤늦게 수락하거나 동시 변경으로 확정 내용이 꼬이지 않게 한다.","박선우"],["R15","P1","약속 표시 일관성","확정 약속을 채팅 카드와 내 대여 카드에 동일하게 표시한다. 약속 확정은 전달 완료나 대여 승인과 별개의 사건이다.","박선우"],["R16","P1","신뢰 지표","거래 완료·빌려준 횟수·반납 약속 준수의 집계 조건을 명세화한다. 점수·별점은 추가하지 않는다. 재처리 시 중복 집계를 막고 거래 0건 표시를 정한다.","이지은"],["R17","P0","정합성 검증과 측정","실제 MySQL 조건에서 동시 승인, 승인/취소 경합, 수정/승인 경합, 반복 반납을 검증한다. 잠금 대기·응답시간·처리량·실패 유형을 기록한다.","이지은·박선우"]],"screens":["request","rentals"]},{"id":"D","title":"채팅·알림","description":"대화와 읽음, 거래 사건을 사용자에게 전달하는 흐름.","owner":"박선우","tasks":[["M01","P1","채팅방 생성","물건 상세의 ‘채팅으로 물어보기’로 승인 전 문의를 시작할 수 있게 한다. 물건·참여자 기준 중복 방 생성과 이후 대여 연결 규칙을 정한다.","주정현·박소빈"],["M02","P1","채팅방 권한","참여자만 목록·대화·전송에 접근하도록 한다. 다른 커뮤니티·차단·이용 제한의 적용 시점과 기존 거래 예외 정책을 연결한다.","노현섭·이지은"],["M03","P1","목록과 필터","마지막 메시지·시각·물건 썸네일·대여 상태·약속·안 읽은 수를 표시한다. 전체/빌린/빌려준/안 읽음 필터를 구현한다.","박소빈·주정현"],["M04","P1","메시지 송수신","메시지 저장, 서버 시각·ID, 목록 순서, 이전 대화 조회, 빈 메시지·길이 제한을 구현한다. 1차 전달 방식은 REST 폴링 또는 WebSocket 중 하나로 제한한다.","이지은 배포 연결"],["M05","P1","읽음과 재접속","읽은 위치와 안 읽은 수, 새로고침·재접속 후 메시지 복구를 구현한다. 화면을 다시 열어도 읽음 상태가 유지되어야 한다.","이지은 인증"],["M06","P1","전송 실패","목업의 ‘전송 실패/다시 보내기/삭제’를 연결한다. 재전송으로 서버 메시지가 중복 저장되지 않게 하고, 실패한 로컬 메시지 삭제와 서버 메시지 삭제를 구분한다.","없음"],["M07","P1","거래·약속 카드 표시","채팅 상단 물건·기간·상태·장소와 대여/약속 시스템 메시지를 표시한다. 약속 입력·카드·수락 버튼의 화면 구현은 D가 맡고, C의 API·검증·상태 계약을 호출한다.","박소빈"],["M08","P1","차단과 안전 UI","차단된 대화방의 입력 비활성화, 프로필·신고·차단 진입, 무료 거래 안전 안내를 연결한다. 서버 전송 권한도 검사한다.","노현섭"],["M09","P0","알림 저장과 종류","요청·승인·거절·취소·반납 알림을 구현한다. 약속·신고 처리 알림은 해당 기능과 함께 추가한다. 수신자·대상 ID·종류·발생 시각을 저장한다.","박소빈·노현섭"],["M10","P0","알림 화면","notifications의 목록·안 읽음 표시·개별 읽음·모두 읽음·헤더 배지를 연결한다. 본인 알림만 조회·변경할 수 있어야 한다.","이지은"],["M11","P0","알림 이동","승인/약속은 해당 대화 또는 거래로, 요청/반납 등은 해당 대여로 이동한다. 채팅 미완성 시 내 대여로 연결하고, 삭제·접근 불가 대상은 안내한다.","박소빈·노현섭"],["M12","P0","거래와 알림 정합성","롤백된 승인 알림이 나가지 않도록 커밋 경계를 정한다. 사건 ID 등으로 중복을 억제하고, 알림 생성 실패의 기록·재처리 방법을 마련한다.","박소빈·노현섭"],["M15","P1","채팅 화면 검증","목록/대화방/약속 시트/확정/안전/전송 실패/차단/로딩/빈 목록을 확인한다. PC의 좌우 분할과 모바일 목록↔방 이동을 확인한다.","박소빈"],["M16","P2","추가 메시지 기능","사진·장소 첨부, 외부 캘린더 추가, 하루 전/1시간 전 리마인더, 자동 위험 문구 안내를 별도 작업으로 남긴다. 리마인더는 약속 변경 시 이전 예약을 무효화한다.","박소빈·주정현"]],"screens":["chat","notifications"]},{"id":"E","title":"커뮤니티·운영","description":"동네 소속과 공용 장소, 차단·신고·관리자 운영.","owner":"노현섭","tasks":[["C01","P0","커뮤니티 모델","동네/단지 식별자·이름·표시 주소·인증 범위·소속 관계를 정의한다. 1차는 운영자가 준비한 커뮤니티 데이터로 시작하는 안을 권장한다.","이지은"],["C02","P0","우리 동네 찾기","join의 이름 검색·후보 목록·현재 위치 찾기를 구현한다. 검색 결과 없음·위치 권한 거부·외부 조회 실패도 처리한다.","이지은 Kakao 설정"],["C03","P0","동네 인증","verify의 위치 권한 요청과 서버의 허용 범위 검증을 구현한다. 정확한 개인 좌표·집 주소를 저장하지 않는 목업 문구에 맞춰 인증 결과·동네·시점만 저장한다.","이지은 회원"],["C04","P0","가입 완료와 변경","joindone과 홈 동네 변경을 연결한다. 로그인했지만 미인증인 사용자 분기, 재인증·소속 변경 조건, 기존 거래 유지 규칙을 정한다.","이지은·박소빈"],["C05","P0","공용 장소","동네별 공용 장소 ID·이름·좌표·안내 문구를 제공한다. 물건 등록·검색 지도·대여 약속이 같은 장소 데이터를 참조하게 한다.","주정현·박소빈"],["C06","P0","도메인 접근 정책","동네 소속·인증·차단·이용 제한의 판정 계약을 제공한다. 각 담당자는 자신의 API에서 실제 검사를 수행하고 누락 여부를 통합 검증한다.","전원"],["C07","P1","차단·해제","profileOther 차단과 blocked 목록·해제를 구현한다. 자기 자신 차단·중복 차단을 막고, 상호 물건 비노출·채팅 차단을 각 도메인에 연결한다.","주정현·박선우"],["C08","P1","신고 접수","프로필·물건 상세·채팅의 신고를 한 접수 기능으로 연결한다. 신고 대상 유형/ID·사유·기타 상세·신고자를 기록하고 악의적 중복 접수 정책을 정한다.","주정현·박선우·이지은"],["C09","P1","내 신고 내역","reports의 사유·날짜·확인 중/처리 완료를 구현한다. 다른 사람의 신고 내역이나 비공개 운영 메모가 노출되지 않게 한다.","이지은 프로필"],["C10","P1","관리자 신고 처리","adminReports의 전체/확인 중/완료 필터와 경고·일시정지·반려 등을 구현한다. 처리자·시각·사유를 남기고 결과 알림을 요청한다.","이지은·박선우"],["C11","P1","제재와 기존 거래","영구정지와 탈퇴/데이터 삭제를 구분한다. 계정 제한 이후에도 미반납 거래를 정리할 절차를 정의한다. 운영 데모 버튼은 실제 관리자 권한 검사를 대체하지 않는다.","이지은·박소빈"],["C12","P2","관리자 통계","admin의 동네 선택·등록 물건·활성 대여·신규 물건/회원·성사율·미처리 신고·주간/카테고리 차트·인기 물건을 연결한다. 집계 기간·분모·제외 상태를 명시한다.","주정현·박소빈·이지은"],["C13","P2","공지 관리","adminNotices의 작성·목록·삭제와 고정 표시를 구현한다. 제목만 있는 목업을 넘어 본문·고정 변경까지 만들지는 별도로 확정한다.","박선우 알림 필요 시"],["C14","P1","정책·안내와 푸터","커뮤니티 규칙·안전·금지 품목·분실/파손·분쟁/신고·신뢰 지표 안내를 실제 구현과 일치시킨다. 이용약관·개인정보·고객센터의 작성 예정 상태를 공개 전 정리한다.","전원 정책 확인"]],"screens":["join","verify","joindone","blocked","reports","admin","adminReports","adminNotices","policy"]},{"id":"common","title":"공통 업무","description":"희망 업무 선택 후 별도 주 담당을 정합니다. 도메인별 검증·문서화는 각 담당 책임입니다.","owner":"별도 배정","tasks":[["M13","P0","관측 설정과 대시보드","Actuator·Micrometer 계측 규칙, Prometheus 수집, Grafana의 응답시간·처리량·오류·DB/잠금 관련 지표를 구성한다. 호스팅·접근 설정은 이지은과 분담한다.","전원 지표 제공"],["M14","P0","공통 측정 양식","k6 결과와 데이터 규모·시나리오·기간·서버 조건을 기록할 양식을 제공한다. 각 담당자가 자신의 스크립트와 개선 결과를 작성한다.","전원"],["공통01 별도 배정","P0","공통 프론트 기반","라우팅·앱 셸·공통 API 호출·에러 형식·모달·토스트·기본 반응형 규칙을 준비한다. 각 화면 구현과 연동은 도메인 담당자가 수행한다.","이지은 인증 처리"],["공통02 별도 배정","P0","통합 일정과 시연","API 계약·ERD 충돌 조정, 통합 시나리오, 배포 체크리스트 취합, 발표 흐름을 책임진다. 문서와 테스트의 원문 작성은 각 담당자가 맡는다.","전원"]],"screens":["ui"]}],"screens":[{"key":"login","label":"로그인","owner":"이지은","dependencies":"노현섭의 미인증 동네 가입 분기"},{"key":"join","label":"우리 동네 찾기","owner":"노현섭","dependencies":"이지은의 로그인 사용자"},{"key":"verify","label":"동네 인증","owner":"노현섭","dependencies":"이지은의 외부 서비스 설정"},{"key":"joindone","label":"가입 완료","owner":"노현섭","dependencies":"이지은의 회원 기본 정보"},{"key":"profile","label":"내 프로필","owner":"이지은","dependencies":"주정현 물건, 박소빈 신뢰 지표, 노현섭 차단·신고"},{"key":"profileOther","label":"이웃 프로필","owner":"이지은","dependencies":"주정현 공개 물건, 박소빈 지표, 노현섭 신고·차단"},{"key":"blocked","label":"차단한 이웃","owner":"노현섭","dependencies":"이지은의 회원 표시 정보"},{"key":"reports","label":"신고 내역","owner":"노현섭","dependencies":"박선우의 처리 결과 알림"},{"key":"register","label":"물건 등록·수정","owner":"주정현","dependencies":"노현섭 공용 장소, 박소빈 기간 검사"},{"key":"detail","label":"물건 상세","owner":"주정현","dependencies":"박소빈 가용 날짜, 이지은 프로필, 박선우 채팅, 노현섭 신고"},{"key":"request","label":"대여 요청","owner":"박소빈","dependencies":"주정현 물건 요약"},{"key":"rentals","label":"내 대여","owner":"박소빈","dependencies":"주정현 물건 요약, 박선우 채팅 이동"},{"key":"chat","label":"채팅","owner":"박선우","dependencies":"박소빈 약속 규칙·API·상태 계약과 거래 상태, 노현섭 신고·차단"},{"key":"home","label":"홈","owner":"주정현","dependencies":"노현섭 동네·회원 수, 박소빈 대여 요약, 박선우 배지"},{"key":"search","label":"물건 찾기","owner":"주정현","dependencies":"박소빈 가용성, 노현섭 장소·소속·차단 정책"},{"key":"notifications","label":"알림","owner":"박선우","dependencies":"박소빈 대여/약속 사건, 노현섭 신고 결과 사건"},{"key":"admin","label":"관리자 대시보드","owner":"노현섭","dependencies":"회원·물건·대여 도메인의 집계 기준"},{"key":"adminReports","label":"신고 관리","owner":"노현섭","dependencies":"이지은 제한 적용, 박선우 알림"},{"key":"adminNotices","label":"공지 관리","owner":"노현섭","dependencies":"필요 시 박선우 공지 알림"},{"key":"ui","label":"확인 모달·토스트","owner":"공통 UI 담당 별도 지정","dependencies":"실제 확인 조건과 문구는 각 도메인 담당"},{"key":"policy","label":"정책·안내·푸터","owner":"노현섭","dependencies":"각 담당의 실제 동작·정책 확인"}],"boundaries":[["외부 연동","A 설정 → E 동네 인증 / B 검색 지도","A는 앱·키·허용 주소·콜백을 설정합니다. 실제 지도 표시와 위치 판정은 사용하는 도메인이 구현합니다."],["인증과 소속","A 로그인 → E 동네 인증","A는 누구인지 식별하고 E는 어느 동네에서 이용 가능한지 판정합니다. 각 API 담당이 권한 검사를 적용합니다."],["물건과 기간","B 가능 기간 → C 승인 점유","검색·달력은 C의 같은 날짜 규칙을 사용합니다. 승인 시 C가 다시 검사하며 B의 기간 수정과 동시에 충돌하지 않게 설계합니다."],["채팅과 약속","C 처리 규칙 → D 화면 연결","C는 약속 모델·API·상태·시간 검증을 소유합니다. D는 채팅 속 입력 UI·카드·수락 버튼과 메시지를 구현합니다."],["프로필","A 화면 ← B 물건 / C 지표 / E 신고·차단","프로필 화면에서 다른 도메인의 데이터를 조립하되, 수정 규칙은 원래 도메인에 유지합니다."],["제재","E 결정 → A 적용 → C 기존 거래","운영 조치는 E가 결정하고 A가 계정에 반영합니다. 미반납 거래 처리는 C와 합의하고 결과 알림은 D가 전달합니다."],["알림","C·E 사건 → D 전달","거래·신고 처리 커밋 이후에 알림을 생성하고 중복·누락·재처리 계약을 정합니다."],["공통 업무","별도 주 담당 지정 + 전원 참여","공통 UI·통합·관측 기반은 특정 도메인에 자동 배정하지 않습니다. 각 도메인은 자신의 화면·테스트·문서·성능 결과를 책임집니다."]],"decisions":[["동네 모델","기획서는 학교·회사·아파트, 목업 가입은 동네/단지 중심","1차는 준비된 생활권 커뮤니티로 범위를 제한한다. 학교·회사 소속 증명은 위치 인증과 별도로 본다.","노현섭"],["위치 인증의 의미","목업은 현 위치로 ‘사는 이웃’을 확인한다고 설명","위치 확인은 해당 반경 내 존재 확인으로 표현한다. 실제 거주·재직·재학 증명이라고 표시하지 않는다.","노현섭"],["거리 기준","개인 좌표를 이후 사용하지 않는다는 문구와 가까운 순·거리 표시가 공존","기본은 동네 중심→공용 장소 거리로 하고 문구를 명시한다. 내 위치 기준을 쓰려면 별도 동의·일시 사용 흐름을 정의한다.","노현섭·주정현"],["기간 경계","시작일·반납일 모두 포함","기존 종료일과 신규 시작일이 같아도 겹침이다. 승인 검사는 기존 시작≤신규 종료 AND 신규 시작≤기존 종료 기준으로 통일한다.","박소빈"],["겹치는 대기 요청","목업은 동일 물건의 대기 요청을 여러 개 표시","대기 요청의 겹침은 허용하고 승인된 점유의 겹침은 금지한다. 승인 실패한 나머지 요청을 자동 거절할지는 별도 정책으로 정한다.","박소빈"],["연체와 후속 대여","연체 물건과 날짜 검색이 함께 존재","실제 미반납 중 새 전달을 허용하지 않는다. 후속 요청·승인 제한 범위와 이미 승인된 다음 거래의 대응을 정한다.","박소빈"],["차단 중 진행 거래","차단 시 대화·물건 비노출이지만 대여는 유지되어야 함","신규 관계는 막고 기존 거래 기록·반납 처리·운영 문의 경로를 유지한다. 기존 거래에 한한 채팅 허용 여부를 화면 문구와 함께 확정한다.","노현섭·박소빈·박선우"],["약속과 날짜 변경","약속 시트는 전달/반납 날짜가 고정","약속은 시간·공용 장소만 바꾼다. 대여 기간 변경은 별도 기능이며 암묵적으로 제공하지 않는다.","박소빈"],["반납 약속 준수","목업에는 준수 분수와 실제 거래 기반 설명","확정된 반납 시각을 기준으로 집계하는 안을 우선 검토한다. 소유자의 늦은 확인, 약속 없는 거래, 수정된 약속 처리 규칙을 먼저 확정한다.","박소빈"],["카테고리 불일치","등록은 5종, 공통 검색/관리자는 더 많은 분류","하나의 기준 목록을 정해 등록·필터·차트 모두 공유한다.","주정현"],["신고 대상","‘이 물건 신고하기’가 이름 기반 신고 모달로 연결됨","회원·물건·대화 중 무엇을 신고했는지 별도 대상 유형과 ID로 보존한다.","노현섭"],["관리자 진입","로그인 화면에 관리자 콘솔 데모 버튼 존재","실서비스에서는 서버의 관리자 권한 검사를 필수로 한다. 데모 바로가기는 제거하거나 권한 있는 사용자에게만 보여 준다.","이지은·노현섭"],["운영 통계","목업 값은 예시이며 카테고리 합계와 등록 총수가 다를 수 있음","예시 숫자를 구현 검증 기준으로 쓰지 않는다. 동일 데이터·기간으로 집계하고 합계/비율을 검증한다.","노현섭"],["서비스 팀명","기획서는 3조, 푸터에는 goorm team2","공개 전 팀 표기를 정리한다.","노현섭"],["자동 기능 확대","사진·캘린더·안전 경고·리마인더가 표시됨","각 기능을 독립 이슈로 남기고 P2로 관리한다. 문구만 남겨 제공 중인 기능처럼 보이게 하지 않는다.","박선우"]],"review":[["D의 추가 업무","채팅·알림 외에 전사 관측·측정이 붙어 부담이 커짐","M13·M14를 별도 배정 공통 업무로 이동"],["E의 공통 책임","팀장 미정인데 통합·발표·기반 업무가 일부 남아 있었음","공통 UI·통합 책임과 데이터 생성 실행 조율을 별도 지정"],["약속 화면의 중복","C의 약속 카드와 D의 채팅 카드 책임이 겹쳐 보임","C는 모델·API·날짜·상태·동시 변경 검증, D는 입력 UI·카드·버튼·시스템 메시지 연결"],["회원 추가 업무","이지은의 고정 범위와 추가 제안이 혼동될 수 있음","인프라·인증은 고정, 회원·프로필은 추가 제안으로 구분"],["목업 분류 문자","기존 화면 A~E와 업무 A~E의 의미가 다름","업무 안내에 별도 분류임을 명시하고 실제 화면별 책임을 매핑"],["P0와 P1 의존","P0 조회·거래에서 P1 차단·제재 정책을 참조함","P0에 판정 인터페이스를 마련하고, P1 기능 도입 시 필터·권한을 함께 통합 검증. 공개 전 차단·신고를 완료"],["보완 기능 책임","프로필·홈·상세에 여러 도메인 데이터가 섞임","화면 조립 담당은 하나로 유지하고 원천 데이터·변경 규칙은 소유 도메인에 유지"]],"principles":["담당자 배정: A 이지은 · B 주정현 · C 박소빈 · D 박선우 · E 노현섭.","목업의 화면 분류 A~E와 이 안내의 업무 묶음 A~E는 서로 다릅니다.","P0 핵심 → P1 보완 → P2 후순위는 제안 순서입니다. 공개 전 최소 차단·신고를 완료합니다.","현재 버튼은 업무 안내만 엽니다. 기존 화면·기기·테마·선택 상태는 닫을 때 그대로 유지됩니다."]};
