# ===================================================================
# 1. 공통 설정
# ===================================================================
spring:
  application:
    name: billim
  task:
    scheduling:
      # 채팅 DB 재확인이 길어져도 다른 주기 작업이 실행될 여유를 둔다.
      pool:
        size: 3
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}
  profiles:
    default: local              # 프로필 미지정 시 local로 동작
  config:
    import: optional:file:.env[.properties]   # 로컬 .env 파일 로드 (없으면 무시)

  datasource:
    hikari:
      # 기본값 10은 대기가 쌓여 처리량 천장 — 30에서 1.44배. 2대 확장 시 25(RDS max_connections 61)
      maximum-pool-size: ${DB_POOL_SIZE:30}

  jpa:
    open-in-view: false         # 뷰 렌더링 중 커넥션 점유 방지
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway로 관리, JPA는 검증만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # DATETIME(6)은 UTC instant (ERD 1장)
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # 선언하지 않은 요청 필드는 400 (API 명세 0.1)
  servlet:
    multipart:
      max-file-size: 10MB               # 10MiB. 애플리케이션 검증(ImageInspector)과 같은 값
      max-request-size: 11MB            # multipart 경계·헤더 여유 1MiB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post   # 카카오는 POST 방식만 허용
            redirect-uri: "{baseUrl}/api/v1/auth/kakao/callback"
            scope: profile_nickname            # 프로필 사진은 저장 컬럼이 없어 요청하지 않음
          naver:
            # 자리값 기본 — 키 미설정이어도 기동, 네이버 로그인 시도만 실패
            client-id: ${NAVER_CLIENT_ID:unset}
            client-secret: ${NAVER_CLIENT_SECRET:unset}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/api/v1/auth/naver/callback"
            # scope 미지정 — 제공 정보는 개발자센터 동의 항목 설정을 따름
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 사용자 정보가 response에 중첩 — id 추출은 SocialOAuth2UserService 담당
            user-name-attribute: response

billim:
  chat:
    websocket:
      # 별도 WSS 진입점 준비 후 활성화. 기존 동일 출처 쿠키 연결은 항상 유지.
      ticket-enabled: ${CHAT_SOCKET_TICKET_ENABLED:false}
      allowed-origins: ${CHAT_SOCKET_ALLOWED_ORIGINS:}
    redis:
      # 단일 서버에서는 로컬 전달·DB 재확인만 사용한다.
      enabled: ${CHAT_REDIS_ENABLED:false}
    delivery:
      # Redis 신호 유실 시 DB에서 누락 메시지를 복구한다.
      poll-interval-ms: ${CHAT_DELIVERY_POLL_INTERVAL_MS:2000}
    rooms:
      enabled: true
  community:
    verification:
      # 허용 정확도 상한. 넘으면 422 LOCATION_INACCURATE.
      # 노트북 Wi-Fi 측위는 수백~수천 m라 100m로는 실내·PC에서 거의 통과하지 못한다
      max-accuracy-meters: ${VERIFY_MAX_ACCURACY_M:5000}
      # 반경 판정에 GPS 오차를 유리하게 반영한다.
      # 켜면 (거리 - 정확도) <= 반경이면 통과. 끄면 거리만으로 판정
      accuracy-tolerance: ${VERIFY_ACCURACY_TOLERANCE:true}
      region:
        # 행정동 코드 판정 on/off. 끄거나 키가 없으면 반경 판정만 쓴다
        enabled: ${VERIFY_REGION_ENABLED:true}
        # 카카오 로컬 API용 REST API 키. 비우면 OAuth client-id를 쓴다.
        # 카카오맵 무료 쿼터는 계정의 첫 활성화 앱 하나뿐이라 쓰려는 앱에 권한이 있어야 한다.
        # 권한이 없으면 403이 오고 반경 판정으로 폴백한다
        api-key: ${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID:}}
        base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
        # 지도 응답을 오래 기다리지 않는다. 늦으면 반경 판정으로 내려가는 편이 낫다
        connect-timeout-ms: 1000
        read-timeout-ms: 2000
        # 자동 등록 동네의 폴백 반경(m). 행정동 코드가 1차 판정이다
        default-radius-m: ${VERIFY_REGION_RADIUS_M:3000}
        # 조회 결과 캐시. 호출 1회가 약 50ms이고 행정동 경계는 개편 때만 바뀐다.
        # 연동 실패는 캐시하지 않으므로 장애 복구가 TTL만큼 늦어지지 않는다
        cache-size: 500
        cache-ttl: 30m
    places:
      auto-supply:
        # 장소가 0개인 동네를 조회 시 공공기관으로 채운다. 부담되면 내린다
        enabled: ${PLACE_AUTO_SUPPLY:true}
        # 한 동네에 채울 장소 수. 반경 5km 한 번에 보통 3건 이상 나온다
        limit: 3
        # 채우지 못한 동네를 다시 시도하기까지의 간격.
        # 섬처럼 후보가 없는 동네와 연동 장애가 매 조회마다 외부를 부르지 않게 한다.
        # 시도 시각은 communities.place_supply_attempted_at에 남아 인스턴스가 공유한다
        retry-after: 1h
  notification:
    outbox:
      # 사건 소비 주기 실행 on/off. 테스트·부하 측정에서 끈다
      enabled: ${OUTBOX_ENABLED:true}
      # 한 번에 점유할 사건 수
      batch-size: 50
      # 작업자 점유 시간. 넘기면 다른 작업자가 재획득 (ERD outbox_events.lease_until)
      lease: 1m
      # 실패 후 재시도 지연. 시도 횟수에 비례해 늘어남
      retry-backoff: 10s
      # 재시도 한도. 넘으면 FAILED로 멈추고 운영에서 원인을 확인
      max-attempts: 5
      # 기동 직후 지연과 폴링 간격
      initial-delay: 5s
      poll-interval: 1s
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}   # 사진 영속 볼륨 경로
  auth:
    # 로그인 성공 후 이동할 프론트엔드 주소. 배포 환경은 환경 변수로 교체
    login-success-url: ${LOGIN_SUCCESS_URL:http://localhost:5173/auth/complete}
    # 사용자가 카카오에서 취소했을 때 복귀할 주소
    login-cancel-url: ${LOGIN_CANCEL_URL:http://localhost:5173/login?error=OAUTH_CANCELED}
    # HTTPS 전용 쿠키. 로컬은 http라 false, 운영은 반드시 true
    cookie-secure: ${COOKIE_SECURE:false}
    # 유휴 만료. 요청마다 연장되며 절대 만료를 넘지 않음
    session-idle-ttl: 2h
    # 절대 만료. 로그인 시각 기준 (ERD auth_sessions)
    session-absolute-ttl: 24h
    # 유휴 만료 갱신 주기. 매 요청 UPDATE 방지
    session-touch-interval: 5m
    # OAuth state 유효 시간 (ERD oauth_login_attempts)
    oauth-state-ttl: 10m
    # 만료 세션·state 정리 주기와 보존 기간. DB는 TTL 자동 삭제가 없어 직접 정리
    cleanup-cron: ${CLEANUP_CRON:0 0 4 * * *}
    cleanup-retention: 7d
    # 한 트랜잭션에 전부 지우면 정리 중 인증 응답시간 상승 — 묶음 단위로 분할 (성능 측정 5절)
    cleanup-chunk-size: ${CLEANUP_CHUNK_SIZE:500}
    cleanup-chunk-pause-ms: ${CLEANUP_CHUNK_PAUSE_MS:50}
    # 익명 엔드포인트(csrf·로그인 시작)의 IP별 분당 제한. 성능 측정 등 한 주소 다량 호출 작업은 끄고 수행
    rate-limit-enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    # 클라이언트 IP를 싣는 프록시(Netlify) 헤더. 없으면 접속 주소로 계수
    rate-limit-client-ip-header: ${AUTH_RATE_LIMIT_IP_HEADER:x-nf-client-connection-ip}
    # Netlify 서명 프록시 비밀값(netlify.toml의 signed와 같은 값). 서명이 맞을 때만 위 헤더 신뢰, 비우면 헤더 무시
    rate-limit-proxy-signature-secret: ${PROXY_SIGNATURE_SECRET:}
    # /api 요청에 Netlify 서명 필수(없으면 403). 옵트인 — 켤 때 위 비밀값 필수, 없으면 기동 거부
    require-proxy-signature: ${REQUIRE_PROXY_SIGNATURE:false}
    rate-limit-csrf-per-minute: ${AUTH_RATE_LIMIT_CSRF_PER_MINUTE:30}
    rate-limit-login-per-minute: ${AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:10}
    # 추적 키 상한. 위조 헤더로 키가 늘어도 메모리 유한
    rate-limit-max-tracked-keys: 50000
    # 관리자 전용 로그인(소셜 불필요). 둘 다 있어야 활성 — 비우면 엔드포인트가 404.
    # 해시는 bcrypt: htpasswd -nbBC 12 "" '비밀번호' | tr -d ':'
    admin-login-id: ${ADMIN_LOGIN_ID:}
    admin-password-hash: ${ADMIN_PASSWORD_HASH:}
    # 관리자 로그인 계정 단위 잠금. 집계 창 안의 연속 실패가 한도에 닿으면 같은 시간만큼 잠금
    admin-login-max-failures: ${ADMIN_LOGIN_MAX_FAILURES:5}
    admin-login-lock-duration: ${ADMIN_LOGIN_LOCK_DURATION:15m}

logging:
  pattern:
    # requestId는 RequestIdFilter가 MDC에 심는다. 오류 응답·응답 헤더의 X-Request-Id와 같은 값
    level: "%5p [${spring.application.name},%X{requestId:-}]"

server:
  shutdown: graceful            # 종료 시 처리 중인 요청을 마치고 종료

management:
  # 지표 전용 포트 — 서비스 포트 노출 시 요청 수·응답시간·DB 상태가 외부에 공개
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}   # 같은 호스트의 Prometheus만 수집. 원격 수집은 보안 그룹으로 허용
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

---
# ===================================================================
# 2. 로컬 개발 환경 (Docker Compose가 DB 접속 정보 자동 주입)
# ===================================================================
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug                     # 실행되는 SQL 확인
    org.hibernate.orm.jdbc.bind: trace           # SQL 파라미터 값 확인

---
# ===================================================================
# 3. 운영 환경
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          kakao:
            # 리버스 프록시(Netlify) 뒤라 {baseUrl} 대신 콜백 주소 명시 — 프록시 Host 처리와 무관한 콜백 복귀
            redirect-uri: ${KAKAO_REDIRECT_URI}
          naver:
            redirect-uri: ${NAVER_REDIRECT_URI:https://billim.netlify.app/api/v1/auth/naver/callback}

server:
  # 프록시(Netlify·ALB)의 X-Forwarded-* 신뢰 — 스킴·호스트 인식
  forward-headers-strategy: framework

billim:
  chat:
    redis:
      # 운영 배포는 Compose에서 Redis 준비 후 기동한다. 장애 시 환경 변수로 비활성화 가능.
      enabled: ${CHAT_REDIS_ENABLED:true}
  auth:
    # 운영은 HTTPS 전제. 환경 변수 누락으로 http 쿠키가 나가는 실수 방지
    cookie-secure: true

# 운영에서는 API 문서 비공개. 비로그인에게 전체 API 구조 노출 방지
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info
