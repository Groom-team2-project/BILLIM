# ===================================================================
# 1. 공통 설정
# ===================================================================
spring:
  application:
    name: billim
  profiles:
    default: local              # 프로필 미지정 시 local로 동작
  config:
    import: optional:file:.env[.properties]   # 로컬 .env 파일 로드 (없으면 무시)

  jpa:
    open-in-view: false         # 뷰 렌더링 중 커넥션 점유 방지
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway로 관리, JPA는 검증만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # DATETIME(6)은 UTC instant (ERD 1장)
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # 선언하지 않은 요청 필드는 400 (API 명세 0.1)
  servlet:
    multipart:
      max-file-size: 10MB               # 10MiB. 애플리케이션 검증(ImageInspector)과 같은 값
      max-request-size: 11MB            # multipart 경계·헤더 여유 1MiB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post   # 카카오는 POST 방식만 허용
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname            # 프로필 사진은 저장 컬럼이 없어 요청하지 않음
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

billim:
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}   # 사진 영속 볼륨 경로
  auth:
    # 로그인 성공 후 이동할 프론트엔드 주소. 배포 환경은 환경 변수로 교체
    login-success-url: ${LOGIN_SUCCESS_URL:http://localhost:5173/auth/complete}
    # HTTPS 전용 쿠키. 로컬은 http라 false, 운영은 반드시 true
    cookie-secure: ${COOKIE_SECURE:false}
    # 유휴 만료. 요청마다 연장되며 절대 만료를 넘지 않음
    session-idle-ttl: 2h
    # 절대 만료. 로그인 시각 기준 (ERD auth_sessions)
    session-absolute-ttl: 24h
    # 유휴 만료 갱신 주기. 매 요청 UPDATE 방지
    session-touch-interval: 5m

server:
  shutdown: graceful            # 종료 시 처리 중인 요청을 마치고 종료

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

---
# ===================================================================
# 2. 로컬 개발 환경 (Docker Compose가 DB 접속 정보 자동 주입)
# ===================================================================
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug                     # 실행되는 SQL 확인
    org.hibernate.orm.jdbc.bind: trace           # SQL 파라미터 값 확인

---
# ===================================================================
# 3. 운영 환경
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    root: info
