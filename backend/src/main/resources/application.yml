# ===================================================================
# 1. 공통 설정
# ===================================================================
spring:
  application:
    name: billim
  profiles:
    default: local              # 프로필 미지정 시 local로 동작
  config:
    import: optional:file:.env[.properties]   # 로컬 .env 파일 로드 (없으면 무시)

  jpa:
    open-in-view: false         # 뷰 렌더링 중 커넥션 점유 방지
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway로 관리, JPA는 검증만
  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post   # 카카오는 POST 방식만 허용
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  shutdown: graceful            # 종료 시 처리 중인 요청을 마치고 종료

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

---
# ===================================================================
# 2. 로컬 개발 환경 (Docker Compose가 DB 접속 정보 자동 주입)
# ===================================================================
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug                     # 실행되는 SQL 확인
    org.hibernate.orm.jdbc.bind: trace           # SQL 파라미터 값 확인

---
# ===================================================================
# 3. 운영 환경
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    root: info
