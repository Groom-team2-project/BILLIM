name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      # 테스트는 Testcontainers(MySQL) 사용 — ubuntu 러너의 Docker로 실행
      - name: Build and test
        run: ./gradlew clean build

      # 빌드된 jar로 배포 이미지가 만들어지는지 검증
      - name: Docker image build check
        run: docker build -t billim-backend:ci .

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # frontend/가 저장소에 올라오기 전까지 이후 단계를 건너뛴다 (프런트엔드 머지 후 제거)
      - name: Check frontend sources
        id: sources
        working-directory: .
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package-lock.json 없음 — 프런트엔드 검증 생략" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.sources.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.sources.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.sources.outputs.exists == 'true'
        run: npm run lint

      - name: Build
        if: steps.sources.outputs.exists == 'true'
        run: npm run build
