name: Deploy Backend

# develop·main push 시 자동 배포. Redis 준비 후 JAR을 교체·재시작. 여러 대면 대상 그룹에서 한 대씩 빼고 교체
on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      S3_KEY: app/app.jar
      REDIS_COMPOSE_KEY: app/compose.redis.prod.yaml

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: jar 빌드
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar
          echo "JAR_PATH=$(ls build/libs/*.jar | grep -v plain | head -n1)" >> "$GITHUB_ENV"

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: S3 업로드
        run: |
          aws s3 cp "backend/${JAR_PATH}" "s3://${{ vars.DEPLOY_BUCKET }}/${S3_KEY}"
          aws s3 cp backend/compose.redis.prod.yaml "s3://${{ vars.DEPLOY_BUCKET }}/${REDIS_COMPOSE_KEY}"

      - name: EC2 배포 (SSM)
        env:
          # 여러 대면 공백 구분 목록, 없으면 1대 변수
          INSTANCE_IDS: ${{ vars.EC2_INSTANCE_IDS || vars.EC2_INSTANCE_ID }}
          # Redis는 한 서버에서만 기동 — 나머지는 사설망으로 공유
          REDIS_INSTANCE_ID: ${{ vars.REDIS_INSTANCE_ID || vars.EC2_INSTANCE_ID }}
          # 비어 있으면 1대 모드 — 대상 그룹 등록 취소·재등록 생략
          TARGET_GROUP_ARN: ${{ vars.TARGET_GROUP_ARN }}
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -Eeuo pipefail

          # 명령을 줄별 배열로 전달 — heredoc 개행 깨짐·sh(dash) pipefail 미지원 회피
          build_params() {
            jq -n \
              --arg b "$BUCKET" \
              --arg k "$S3_KEY" \
              --arg redisCompose "$REDIS_COMPOSE_KEY" \
              --arg r "$REGION" \
              --argjson redis "$1" \
              '{commands: (
                [
                  "set -eu",
                  "export PATH=$PATH:/snap/bin",
                  "command -v aws >/dev/null || snap install aws-cli --classic"
                ]
                + (if $redis then [
                  ("aws s3 cp s3://" + $b + "/" + $redisCompose + " /home/ubuntu/BILLIM/backend/compose.redis.prod.yaml --region " + $r),
                  "command -v docker >/dev/null",
                  "docker compose version >/dev/null",
                  "docker compose -f /home/ubuntu/BILLIM/backend/compose.redis.prod.yaml up -d --wait"
                ] else [] end)
                + [
                  ("aws s3 cp s3://" + $b + "/" + $k + " /home/ubuntu/BILLIM/backend/app.jar.new --region " + $r),
                  "chown ubuntu:ubuntu /home/ubuntu/BILLIM/backend/app.jar.new",
                  "mv /home/ubuntu/BILLIM/backend/app.jar.new /home/ubuntu/BILLIM/backend/app.jar",
                  "systemctl restart billim",
                  "for i in $(seq 1 40); do curl -fsS http://127.0.0.1:9090/actuator/health 2>/dev/null | grep -q UP && exit 0; sleep 3; done; echo \"헬스체크 UP 대기 시간 초과\" >&2; exit 1"
                ]
              )}'
          }

          # SSM 명령 실행 후 완료까지 대기
          run_ssm() {
            local id="$1" cmd status
            cmd=$(aws ssm send-command \
              --instance-ids "$id" \
              --document-name "AWS-RunShellScript" \
              --comment "deploy ${GITHUB_SHA::7}" \
              --parameters file://ssm-params.json \
              --query "Command.CommandId" --output text)
            echo "SSM Command: $cmd"

            for i in $(seq 1 60); do
              status=$(aws ssm get-command-invocation \
                --command-id "$cmd" --instance-id "$id" \
                --query "Status" --output text 2>/dev/null || echo Pending)
              echo "[$i] $status"
              case "$status" in
                Success) return 0 ;;
                Failed|Cancelled|TimedOut)
                  echo "❌ 배포 실패 — 서버 로그:"
                  aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
                    --query "StandardErrorContent" --output text
                  return 1 ;;
              esac
              sleep 5
            done
            echo "⏱️ 타임아웃"; return 1
          }

          # 한 대씩 교체 — 대상 그룹에서 뺀 서버만 재시작해 나머지가 요청 처리
          # 실패 시 해당 서버는 등록 취소 상태로 두고 중단 (비정상 서버로 요청 유입 방지)
          for id in $INSTANCE_IDS; do
            echo "::group::$id"
            target="Id=$id,Port=8080"

            if [ -n "$TARGET_GROUP_ARN" ]; then
              aws elbv2 deregister-targets --target-group-arn "$TARGET_GROUP_ARN" --targets "$target"
              aws elbv2 wait target-deregistered --target-group-arn "$TARGET_GROUP_ARN" --targets "$target"
              echo "대상 그룹 등록 취소 완료"
            fi

            if [ "$id" = "$REDIS_INSTANCE_ID" ]; then
              build_params true > ssm-params.json
            else
              build_params false > ssm-params.json
            fi
            run_ssm "$id"

            if [ -n "$TARGET_GROUP_ARN" ]; then
              aws elbv2 register-targets --target-group-arn "$TARGET_GROUP_ARN" --targets "$target"
              aws elbv2 wait target-in-service --target-group-arn "$TARGET_GROUP_ARN" --targets "$target"
              echo "대상 그룹 재등록 완료"
            fi
            echo "::endgroup::"
          done
          echo "✅ 배포 성공"
