# Netlify 배포 설정 — 모노레포의 frontend만 빌드

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # CI(.github/workflows/ci.yml)와 동일하게 고정
  NODE_VERSION = "22"

# API 프록시 — 백엔드로 전달
[[redirects]]
  from = "/api/*"
  to = "http://52.78.14.19:8080/api/:splat"
  status = 200
  force = true
  # 요청마다 x-nf-sign(HS256 JWS) 부착 — 백엔드가 직접 호출과 구분해 IP 헤더 위조 차단.
  # 값은 사이트 환경 변수 PROXY_SIGNATURE_SECRET(스코프에 Runtime 포함)
  signed = "PROXY_SIGNATURE_SECRET"

# SPA 라우팅 — /profile 같은 주소로 직접 들어와도 index.html 반환
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 해시가 붙은 정적 파일은 길게 캐시
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
