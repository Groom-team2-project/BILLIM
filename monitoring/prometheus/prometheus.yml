global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 앱 서버 관리 포트(9090). 대상은 targets/*.json — 서버 추가·교체 시 파일만 수정, 재시작 불필요
  - job_name: billim-app
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
